# Étape 2 (certificat obtenu) : remplace le fichier http-only.
# Chemins webroot / letsencrypt : aligner sur tes autres vhosts si besoin.
server {
    listen 80;
    server_name save.emilienbourdet.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name save.emilienbourdet.fr;

    ssl_certificate     /etc/letsencrypt/live/save.emilienbourdet.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/save.emilienbourdet.fr/privkey.pem;

    client_max_body_size 10m;

    # DNS interne Docker : nginx démarre même si save-app est arrêté.
    resolver 127.0.0.11 valid=30s;

    location / {
        set $save_upstream http://save-app:3000;
        proxy_pass $save_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
